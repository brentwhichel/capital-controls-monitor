name: Publish report

on:
  issues:
    types: [opened, edited]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: publish-report
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.actor == github.repository_owner &&
       github.event.issue.title == 'Publish channel (automated)' &&
       contains(github.event.issue.body, 'ccm-payload-v1'))
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - name: Read the update from the publishing issue
        if: github.event_name == 'issues'
        shell: python
        run: |
          import base64, json, lzma, os, re
          ev = json.load(open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8"))
          body = ev["issue"]["body"] or ""
          m = re.search(r"ccm-payload-v1\s+([A-Za-z0-9+/=\s]+?)\s*ccm-end", body)
          if not m:
              raise SystemExit("No payload found in the issue body")
          upd = json.loads(lzma.decompress(base64.b64decode("".join(m.group(1).split()))))
          for path, blob in (upd.pop("files", None) or {}).items():
              if not re.fullmatch(r"tools/[A-Za-z0-9_.-]+", path):
                  raise SystemExit("Refusing to write " + path)
              os.makedirs("tools", exist_ok=True)
              with open(path, "wb") as f:
                  f.write(lzma.decompress(base64.b64decode(blob)))
          with open(os.path.join(os.environ["RUNNER_TEMP"], "update.json"), "w", encoding="utf-8") as f:
              json.dump(upd, f)

      - name: Build the site
        run: |
          if [ "${{ github.event_name }}" = "issues" ]; then
            python3 tools/build_report.py --state data/state.json --update "$RUNNER_TEMP/update.json" --out .
          else
            python3 tools/build_report.py --state data/state.json --out .
          fi

      - name: Commit the new report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs data tools README.md
          if git diff --cached --quiet; then
            echo "Nothing changed"
          else
            git commit -m "Report $(jq -r '.report.date' data/state.json): $(jq -r '.report.level' data/state.json)"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Leave a receipt on the issue
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number }}
        run: |
          gh issue edit "$NUM" --repo "$GITHUB_REPOSITORY" --body "Published $(jq -r '.report.date' data/state.json) ($(jq -r '.report.level' data/state.json)) at $(date -u +%Y-%m-%dT%H:%MZ), commit $(git rev-parse --short HEAD). This issue is the publishing channel for the daily report."

      - name: Record a failure on the issue
        if: failure() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number }}
        run: |
          gh issue edit "$NUM" --repo "$GITHUB_REPOSITORY" --body "FAILED to publish at $(date -u +%Y-%m-%dT%H:%MZ). Details: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
